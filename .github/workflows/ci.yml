name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-version: ["6.0", "6.1"]

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "Django~=${{ matrix.django-version }}.0"

      - name: Run tests
        run: |
          pytest tests/ -v

  test-valkey:
    runs-on: ubuntu-latest

    services:
      valkey:
        image: valkey/valkey:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with Valkey
        run: |
          pytest tests/ -v

  # A Windows runner has no Linux container, so Redis is the redis-windows
  # build of the upstream source, registered as a Windows service through
  # the RedisService.exe it ships: a plain background process does not
  # outlive the step that started it. The tests that deliver a signal with
  # os.kill() are skipped on Windows (see CONTRIBUTING.md); the rest runs.
  test-windows:
    runs-on: windows-latest
    name: test (Windows)

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Redis as a Windows service
        env:
          REDIS_VERSION: "8.10.1"
          # The sha256 digest GitHub reports for the release asset.
          REDIS_SHA256: "8d7710c858eb9ef24685d040272fa42f6b045906cbab14dc635697a20303af1b"
        run: |
          $name = "Redis-$env:REDIS_VERSION-Windows-x64-msys2-with-Service"
          $url = "https://github.com/redis-windows/redis-windows/releases/download/$env:REDIS_VERSION/$name.zip"
          Invoke-WebRequest $url -OutFile "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash
          if ($hash -ne $env:REDIS_SHA256) {
            throw "Checksum mismatch for $name.zip: got $hash"
          }
          Expand-Archive "$name.zip" -DestinationPath C:\
          New-Item -ItemType Directory -Force C:\redis-data | Out-Null
          & "C:\$name\RedisService.exe" install --port 6379 --dir C:\redis-data
          Start-Service Redis
          "C:\$name" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Wait for Redis
        run: |
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            if ((redis-cli ping 2>$null) -eq "PONG") {
              redis-cli info server | Select-String "redis_version"
              exit 0
            }
            Start-Sleep -Seconds 1
          }
          Get-Service Redis | Format-List
          Write-Error "Redis did not answer PING within 30 seconds"
          exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.0"
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Run ruff check
        run: |
          ruff check .

      - name: Run ruff format check
        run: |
          ruff format --check .

      - name: Check translation catalogs
        run: |
          for po in $(find django_tasks_redis/locale -name '*.po'); do
            msgfmt --check -o /dev/null "$po"
          done
